  /v1/admin/refunds:
    get: { tags: [ Admin ], operationId: adminRefunds, security: [ { bearerAuth: [] } ], responses: { '200': { description: A page of refunds, content: { application/json: { schema: { $ref: "#/components/schemas/RefundPage" } } } } }, description: "Requires permission `payments:read`. Newest first, keyset-paged (default 100, max 200), optional `status` filter. `paymentCapability` says whether processing can work without exposing any key.", parameters: [ { name: status, in: query, schema: { type: string, enum: [ requested, pending, processed, failed ] } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }, { name: cursor, in: query, schema: { type: string, maxLength: 300 } } ] }
  /v1/admin/refunds/{id}/process:
    post: { tags: [ Admin ], operationId: adminProcessRefund, security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], responses: { '200': { description: Refund processed or already processed, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, status: { type: string, enum: [ processed, pending, failed ] } }, required: [ id, status ] } } } } }, description: 'Requires permission `refunds:write` and an MFA (aal2) session. Preconditions: a payment gateway is configured (else 422 `UNSUPPORTED_PAYMENT_METHOD`; check `paymentCapability` on the list first) and the order has a captured online payment (else 409 `ILLEGAL_STATE`; COD refunds are manual). Safe to retry: the gateway call uses the refund idempotency key, an already-processed refund returns `{ id, status: "processed" }`, and a gateway failure leaves the refund `failed` so it can be retried.' }
  /v1/admin/ops/outbox:
    get: { tags: [ Admin ], operationId: adminOutbox, security: [ { bearerAuth: [] } ], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } } } }
  /v1/admin/ops/outbox/{id}/replay:
