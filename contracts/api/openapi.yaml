  /v1/admin/catalog/variants:
    get: { tags: [ Admin ], operationId: adminVariants, security: [ { bearerAuth: [] } ], responses: { '200': { description: Variants, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { id: { type: string }, productId: { type: string }, sku: { type: string }, name: { type: string }, title: { type: string }, pricePaise: { $ref: "#/components/schemas/Money" }, comparePaise: { allOf: [ { $ref: "#/components/schemas/Money" } ], nullable: true }, active: { type: boolean }, hsnCode: { type: string, nullable: true }, updatedAt: { type: string, format: date-time } } } }, nextCursor: { type: string, nullable: true } }, required: [ items, nextCursor ] } } } } }, description: "Requires permission `catalog:read`. Variants with the `updatedAt` stamp that price/metadata edits need (`expectedUpdatedAt`). Filter with `productId`; keyset-paged (`limit` default 500, max 1000, `nextCursor`).", parameters: [ { name: productId, in: query, schema: { type: string, pattern: "^[a-z0-9-]+$", maxLength: 100 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }, { name: cursor, in: query, schema: { type: string, maxLength: 300 } } ] }
  /v1/admin/catalog/variants/{id}:
    patch:
      tags: [ Admin ]
      operationId: adminUpdateVariant
      description: >-
        Guarded, audited variant edit. `expectedUpdatedAt` (the variant's updatedAt you loaded) and `reason` are required; a stale timestamp is 409. Besides price/MRP/active it edits SKU, title, package weight/dimensions, HSN, barcode, low-stock threshold and (admin only) cost. A change to selling price, MRP or availability bumps `rules_version`, so open checkout quotes become stale.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/VariantId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ reason, expectedUpdatedAt ]
              additionalProperties: false
              properties:
                pricePaise: { type: integer, minimum: 0 }
                comparePaise: { type: integer, minimum: 0, nullable: true }
                active: { type: boolean }
                title: { type: string, minLength: 1, maxLength: 80 }
                sku: { type: string, minLength: 2, maxLength: 60 }
                weightGrams: { type: integer, minimum: 1, maximum: 50000, nullable: true }
                lengthMm: { type: integer, minimum: 1, maximum: 2000, nullable: true }
                widthMm: { type: integer, minimum: 1, maximum: 2000, nullable: true }
                heightMm: { type: integer, minimum: 1, maximum: 2000, nullable: true }
                hsnCode: { type: string, pattern: '^[0-9]{4,8}$', nullable: true }
                barcode: { type: string, minLength: 4, maxLength: 40, nullable: true }
                costPricePaise: { type: integer, minimum: 0, nullable: true }
                lowStockThreshold: { type: integer, minimum: 0, maximum: 100000 }
                reason: { type: string, minLength: 3, maxLength: 300 }
                expectedUpdatedAt: { type: string, format: date-time }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } } }
