  /v1/content:
    get:
      tags: [ Experience ]
      operationId: listContent
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ items ], properties: { items: { type: array, items: { type: object, required: [ slug, kind, title, version ], properties: { slug: { type: string }, kind: { type: string }, title: { type: string }, version: { type: integer }, publishedAt: { type: string, format: date-time } } } } } } } } }
