      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ items, nextCursor ], properties: { items: { type: array, items: { type: object, required: [ id, kind, title, body, read, createdAt ], properties: { id: { type: string }, kind: { type: string }, title: { type: string }, body: { type: string }, read: { type: boolean }, createdAt: { type: string, format: date-time } } } }, nextCursor: { type: string, nullable: true } } } } } }
  /v1/notifications/{id}/read:
