    post:
      tags:
        - Admin
      operationId: postAdminProductsIdDuplicate
      description: >-
        Requires permission `catalog:write`. Creates an INACTIVE copy of the product. Without `newId` the copy takes the first free `<id>-copy`, `<id>-copy-2`, `<id>-copy-3`, ... (up to 50; then 422 asking for an explicit id) and its variants get SKUs that cannot collide with an earlier copy, so duplicating the same product repeatedly always succeeds. With `newId` (slug) that id is used; an id that already exists is 422 `VALIDATION_FAILED`. Responds 201 with the new Product.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
