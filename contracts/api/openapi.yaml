    RefundPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              orderId:
                type: string
                format: uuid
              amountPaise:
                $ref: "#/components/schemas/Money"
              status:
                type: string
                enum:
                  - requested
                  - pending
                  - processed
                  - failed
              reason:
                type: string
              createdAt:
                type: string
                format: date-time
              processable:
                type: boolean
                description: True when `POST /refunds/{id}/process` can succeed right now (gateway configured, captured online payment, refund not yet processed).
              blockedReason:
                type: string
                nullable: true
                enum:
                  - already_processed
                  - no_gateway
                  - no_online_payment
                  - null
                description: Why it cannot be processed, or null.
