  /v1/app/version-check:
    get:
      tags:
        - Experience
      operationId: getAppVersionCheck
      description: "Launch-time gate for the mobile app (public, short-cached). Required query: `platform` (android|ios) and `version` (x.y.z). `status` is `ok`, `update_available` (older than `latestVersion`) or `force_update` (older than `minSupportedVersion`); show `message` and send the user to `storeUrl`. Operators edit the policy in Settings -> Platform -> App versions (`/v1/admin/app-versions`). Clients must treat any failure as `ok`."
      responses:
        "200":
          description: Policy result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - update_available
                      - force_update
                  latestVersion:
                    type: string
                  minSupportedVersion:
                    type: string
                  storeUrl:
                    type: string
                  message:
                    type: string
                required:
                  - status
                  - latestVersion
                  - minSupportedVersion
                  - storeUrl
                  - message
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum:
              - android
              - ios
        - name: version
          in: query
          required: true
          schema:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
  /v1/experience/{channel}:
    get:
      tags:
        - Experience
      operationId: getExperienceChannel
      description: "The published experience bundle for `app` or `web`: `{ schemaVersion, channel, enabled, release, tokens, navigation, chrome, pages, content, media, variables, diagnostics, generatedAt }`. `enabled:false` means use the built-in design (kill switch). Send `X-JW-Client: <web|app>/<version>[+build]; platform=<android|ios|web>; caps=<block types>`: block types not listed in `caps` are held back (counted in `diagnostics.heldBack`). Responses carry `ETag` and `Cache-Control: public, max-age=60, stale-while-revalidate=300` with `Vary: X-JW-Client`; send `If-None-Match` (strong, weak, list or `*`) for 304. Campaigns apply by time, `{{store.*}}` variables are substituted, and product sources are resolved against live data into `pages.<key>.blocks[].resolved.productIds`. OUT-OF-STOCK RULE: sold-out products stay in the list but never lead it - rule-fed sources (collection, category, newest, bestsellers) list in-stock first, a manual source keeps the editor order - and `resolved.outOfStockIds` names the sold-out ones. `media.<id>` carries `kind`, `url`, `alt`, `poster`, `bundledKey`. Media referenced here must be approved to be served (see getMediaShaFile)."
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum:
              - app
              - web
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
