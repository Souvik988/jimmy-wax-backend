        - invoiceNumber
        - issuedAt
        - orderNumber
        - seller
        - buyer
        - lines
        - totals
        - hsnIncluded
      properties:
        invoiceNumber:
          type: string
        issuedAt:
          type: string
          format: date-time
        orderNumber:
          type: string
        seller:
          type: object
          properties:
            legalName:
              type: string
            gstin:
              type: string
            state:
              type: string
            address:
              type: string
        buyer:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            state:
              type: string
            pin:
              type: string
        placeOfSupply:
          type: string
        supply:
          type: string
          enum:
            - intra_state
            - inter_state
        gstRatePercent:
          type: number
        priceBasis:
          type: string
          enum:
            - inclusive
            - exclusive
        lines:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              sku:
                type: string
              hsn:
                type: string
                nullable: true
              quantity:
                type: integer
              unitPricePaise:
