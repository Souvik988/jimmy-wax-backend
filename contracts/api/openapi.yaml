  /v1/admin/orders/{id}/cancel:
    post: { tags: [ Admin ], operationId: adminCancelOrder, description: Requires MFA (aal2)., security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } } } }
  /v1/admin/orders/{id}/cod-collected:
