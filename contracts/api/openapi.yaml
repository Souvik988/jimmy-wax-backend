openapi: 3.0.3
info:
  title: JIMMY WAX Commerce API
  version: 1.6.0
  description: |
    Canonical contract shared by the Flutter customer app and the Express backend.
    Conventions: REST under `/v1`; ids are opaque strings; timestamps are UTC ISO-8601;
    money is an INTEGER number of paise (INR minor units, always `currency: INR`, never a float,
    always <= 9007199254740991). Errors use `ErrorBody`. Customer calls need `Authorization: Bearer <access token>`
    issued by this API's own identity service (`/v1/auth/*`): EdDSA JWT, 15-minute access token + rotating refresh token. Clients never send payable totals, stock, roles or payment
    status: they send intent (quote → order) and the server decides.

    Any operation may additionally return 400, 401, 403, 429, 500 or 503 with `ErrorBody` (the contract tests enforce this).
    Rate limiting returns 429 with `Retry-After`. Error `code` is the stable machine-readable field; `message` is for humans.

        ## Contract 1.4.0 operational notes
        - **Admin rate limits (DASH-BR-049).** Per signed-in operator, one-minute window: reads (GET/HEAD) 600, writes 360 (`ADMIN_RATE_READ_PER_MIN`, `ADMIN_RATE_WRITE_PER_MIN`). Over the limit: 429 `RATE_LIMITED` with `Retry-After`. Reads and writes are counted separately.
        - **Catalogue cache (DASH-BR-050).** Public catalogue reads are cached 5 s inside the experience API and sent with `Cache-Control: public, max-age=30, stale-while-revalidate=60`. An archived/deactivated product therefore disappears from the public API within about 5 s and from clients/CDN caches within at most about 95 s. There is no per-product purge.
        - **Public media (DASH-BR-042).** `GET /v1/media/{sha}/{file}` serves only media that is approved, ready and not archived. Draft, rejected and archived media answer 404, exactly like a missing file. Approving/rejecting is administrators-only (`media:write` and role `admin`). Operators preview unapproved bytes through `GET /v1/admin/media-files/{sha}/{file}`. Approved responses are immutable-cached for a year: rejecting later stops the origin but cannot recall copies already cached by browsers or a CDN.
        - **ETag.** Document and bundle responses carry `ETag`; `If-None-Match` accepts strong, weak (`W/`), comma-separated and `*` validators.
        - **Guard errors carry detail.** `error.lines` lists blockers (for example the Studio items that still use a media file or collection) or the current server copy on a stale write.
  x-contract-status: DRAFT — authored by the backend session; Flutter consumption not yet verified (see CONTRACT_DECISIONS.md)
servers:
  - url: https://api.example.invalid
    description: Placeholder. One public API origin routes /v1 to the commerce and experience deployments (not provisioned).
tags:
  - name: Experience
    description: Public, cacheable reads (served by experience-api)
  - name: Customer
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Webhooks
  - name: Auth
    description: Own identity service (email + password, rotating refresh tokens, operator TOTP MFA)
  - name: Reviews
  - name: Admin
security: []
paths:
  /v1/store-settings:
    get:
      tags: [ Experience ]
      operationId: getStoreSettings
      summary: Public store policy used to render shipping/COD/checkout state
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StoreSettingsPublic' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/categories:
    get:
      tags: [ Experience ]
      operationId: listCategories
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ items ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
  /v1/products:
    get:
      tags: [ Experience ]
      operationId: listProducts
      description: Keyset pagination ordered by (sort_order, id). `q` is a case-insensitive substring search over name/subtitle/description (min 2 chars).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 300 } }
        - { name: category, in: query, schema: { type: string, pattern: '^[a-z0-9-]+$' } }
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 60 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/products/{id}:
    get:
      tags: [ Experience ]
      operationId: getProduct
      parameters: [ { $ref: '#/components/parameters/Slug' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/products/{id}/reviews:
    get:
      tags: [ Experience ]
      operationId: listProductReviews
      description: Approved reviews only; no author identity.
      parameters:
        - { $ref: '#/components/parameters/Slug' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }
    post:
      tags: [ Reviews ]
      operationId: createReview
      description: Verified purchasers only (delivered order containing the product). One review per product; starts as pending moderation.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Slug' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ rating, title, body ], properties: { rating: { type: integer, minimum: 1, maximum: 5 }, title: { type: string, maxLength: 120 }, body: { type: string, maxLength: 3000 } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [ id, status ], properties: { id: { type: string }, status: { type: string, enum: [ pending ] }, moderation: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/guest-carts:
    post:
      tags: [ Cart ]
      operationId: createGuestCart
      description: Creates an anonymous cart. The returned token is a bearer secret (store in secure storage); only its hash is stored.
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [ guestCartToken, cart ], properties: { guestCartToken: { type: string }, cart: { $ref: '#/components/schemas/Cart' } } } } } }
        '429': { $ref: '#/components/responses/Error' }
  /v1/guest-cart:
    get:
      tags: [ Cart ]
      operationId: getGuestCart
      parameters: [ { $ref: '#/components/parameters/GuestToken' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/guest-cart/lines/{variantId}:
    put:
      tags: [ Cart ]
      operationId: setGuestCartLine
      parameters: [ { $ref: '#/components/parameters/GuestToken' }, { $ref: '#/components/parameters/VariantId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartLineMutation' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/me:
    get:
      tags: [ Customer ]
      operationId: getMe
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [ Customer ]
      operationId: updateMe
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { fullName: { type: string, maxLength: 120 }, phone: { type: string, nullable: true } } } } } }
      responses:
        '204': { description: Updated }
  /v1/me/preferences:
    put:
      tags: [ Customer ]
      operationId: setPreferences
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ orderUpdates, offersAndCareTips ], properties: { orderUpdates: { type: boolean }, offersAndCareTips: { type: boolean } } } } } }
      responses:
        '204': { description: Updated }
  /v1/addresses:
    get:
      tags: [ Customer ]
      operationId: listAddresses
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ items ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Address' } } } } } } }
    post:
      tags: [ Customer ]
      operationId: createAddress
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/addresses/{id}:
    put:
      tags: [ Customer ]
      operationId: updateAddress
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [ Customer ]
      operationId: deleteAddress
      description: Deleting a saved address never alters past orders (each order keeps an immutable address snapshot).
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /v1/cart:
    get:
      tags: [ Cart ]
      operationId: getCart
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /v1/cart/lines/{variantId}:
    put:
      tags: [ Cart ]
      operationId: setCartLine
      description: Sets the quantity of one variant (0 removes). Pass `expectedVersion` for optimistic concurrency; a mismatch returns 409 CART_VERSION_CONFLICT.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/VariantId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartLineMutation' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/cart/merge:
    post:
      tags: [ Cart ]
      operationId: mergeGuestCart
      description: 'Merge policy: per variant quantity = min(99, userQty + guestQty); the guest cart is consumed.'
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ guestCartToken ], properties: { guestCartToken: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
  /v1/wishlist:
    get:
      tags: [ Customer ]
      operationId: listWishlist
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WishlistPage' } } } }
  /v1/wishlist/{productId}:
    put:
      tags: [ Customer ]
      operationId: addWishlist
      description: Idempotent add.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: productId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' } } ]
      responses:
        '204': { description: Added (or already present) }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [ Customer ]
      operationId: removeWishlist
      description: Idempotent remove.
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: productId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' } } ]
      responses:
        '204': { description: Removed (or already absent) }
  /v1/checkout/quotes:
    post:
      tags: [ Checkout ]
      operationId: createQuote
      description: |
        Server-calculated quote from the caller's cart. Does NOT reserve stock (`stockReserved: false`).
        Errors: CHECKOUT_DISABLED, POLICY_NOT_CONFIGURED, UNSUPPORTED_PAYMENT_METHOD, NOT_SERVICEABLE,
        ITEM_UNAVAILABLE, STOCK_SHORTAGE (never silently buys a valid subset).
      security: [ { bearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateQuoteRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders:
    post:
      tags: [ Orders ]
      operationId: createOrder
      description: |
        Places an order from a quote in ONE transaction. Requires `Idempotency-Key`.
        Same key + same quote → the original response again (`Idempotent-Replayed: true`); same key + different
        quote → 422 DUPLICATE_REQUEST_MISMATCH; concurrent duplicates serialise. Cart changed after the quote →
        409 CART_VERSION_CONFLICT; expired → 409 QUOTE_EXPIRED; prices/rules changed → 409 QUOTE_STALE.
        COD orders are `placed`/`cod_due`; online orders are `pending_payment` with stock reserved until the payment window ends.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ quoteId ], properties: { quoteId: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Created (or replay of the original), content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      tags: [ Orders ]
      operationId: listOrders
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
  /v1/orders/{id}:
    get:
      tags: [ Orders ]
      operationId: getOrder
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/cancel:
    post:
      tags: [ Orders ]
      operationId: cancelOrder
      description: Allowed while `pending_payment` or `placed`. Idempotent. A paid online order queues a refund.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ reason ], properties: { reason: { type: string, minLength: 1, maxLength: 300 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/payment-attempts:
    post:
      tags: [ Orders ]
      operationId: createPaymentAttempt
      description: Creates or resumes the single live payment attempt for an online order. `clientConfig` is what the gateway SDK needs. The app NEVER decides payment success from an SDK callback; poll `/payment`.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/payment-attempts/confirm:
    post:
      tags: [ Orders ]
      operationId: confirmPaymentAttempt
      description: |
        Finishes an online payment from the checkout SDK callback without waiting for the provider webhook (webhooks cannot reach a development machine and may lag). Send the references the SDK returned: Razorpay `razorpay_order_id` as `providerOrderId`, `razorpay_payment_id` as `providerPaymentId` and `razorpay_signature` as `signature`. The server verifies the signature (HMAC-SHA256 of `order_id|payment_id` with the key secret), then asks the provider for the order status itself and applies it through the same idempotent path as webhooks; the client never decides success. The response is the server-confirmed state (`paymentStatus` is `paid` once the provider reports the order paid; otherwise keep polling `GET /v1/orders/{id}/payment`). Safe to repeat. 401 when the signature is wrong, 404 when the reference does not belong to the caller's order, 503 (retryable) when the provider cannot confirm yet.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ providerOrderId, providerPaymentId, signature ], properties: { providerOrderId: { type: string, minLength: 3, maxLength: 100 }, providerPaymentId: { type: string, minLength: 3, maxLength: 100 }, signature: { type: string, minLength: 16, maxLength: 256 } } } } } }
      responses:
        '200': { description: Server-confirmed state, content: { application/json: { schema: { type: object, required: [ orderStatus, paymentStatus, attemptStatus ], properties: { orderStatus: { type: string }, paymentStatus: { type: string }, attemptStatus: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/payment:
    get:
      tags: [ Orders ]
      operationId: getOrderPayment
      description: Server-confirmed payment state (the only source of truth for "paid").
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatusView' } } } }
  /v1/orders/{id}/payment-link:
    post:
      tags: [ Orders ]
      operationId: createPaymentLink
      description: |
        For the mobile app, which cannot POST a form to the provider. Creates or resumes the order's single live payment attempt (same rules as `createPaymentAttempt`) and returns a short-lived (10 minutes) signed `url` to open in the system browser; that page forwards the customer to the provider's hosted checkout. When the customer returns, read the server-confirmed state from `GET /v1/orders/{id}/payment` (also on app resume); never infer success from the browser. If `APP_RETURN_URL` is configured the browser is sent to `<APP_RETURN_URL>?order=<id>&pay=paid|pending|failed`, otherwise it shows a "return to the app" page.
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/Uuid' } ]
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, required: [ url, expiresAt, attempt ], properties: { url: { type: string, format: uri }, expiresAt: { type: string, format: date-time }, attempt: { $ref: '#/components/schemas/PaymentAttempt' } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/payments/{provider}/start:
    get:
      tags: [ Orders ]
      operationId: paymentCheckoutStart
      description: Browser page reached through the signed link from `createPaymentLink`; not called by app code. Verifies the token (HMAC, 10 minute expiry, names only the order) and renders a tiny page that auto-submits the hosted-checkout form built from our own data. 410 when the link expired or the order can no longer be paid.
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } }, { name: t, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: HTML page that forwards to the provider }
        '404': { $ref: '#/components/responses/Error' }
        '410': { description: Link expired or order not payable }
  /v1/payments/{provider}/return:
    post:
      tags: [ Orders ]
      operationId: paymentCheckoutReturn
      description: |
        Browser landing for hosted (redirect) checkout - not called by app code. The website posts the customer to the provider's hosted page with this URL as `callback_url`; the provider then POSTs the browser here as `application/x-www-form-urlencoded` (Razorpay: `razorpay_payment_id`, `razorpay_order_id`, `razorpay_signature`, or `error[...]` fields when the payment failed or was cancelled). No session is needed: the server verifies the signature, asks the provider for the order status itself, applies it idempotently and answers `303` to `STOREFRONT_ORIGIN/orders/{orderId}?pay=paid|pending|failed` (`&placed=1` when paid). The destination comes only from server configuration, never from the request. Always read the final state from `GET /v1/orders/{id}/payment`.
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } }, { name: c, in: query, required: false, schema: { type: string, enum: [ app ] }, description: 'Set by the app hand-off page: answer with the app deep link (or a close-this-tab page) instead of the website redirect.' } ]
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object } } } }
      responses:
        '303': { description: Redirect back to the storefront order page }
        '404': { $ref: '#/components/responses/Error' }
  /v1/webhooks/{provider}:
    post:
      tags: [ Webhooks ]
      operationId: receiveWebhook
      description: 'Provider-only; not for clients. `provider` is the configured payment gateway (`razorpay`), the configured shipping provider (`shiprocket`) or `email`. Payment: verified against the RAW body signature. Shipping: verified with the shared `x-api-key` token. Email (only when `EMAIL_WEBHOOK_TOKEN` is set, otherwise 404): `Authorization: Bearer <token>` and body `{ events: [{ type: "bounce"|"hard_bounce"|"complaint"|"delivered"|..., email, detail? }] }` - hard bounces and complaints suppress the address (response `{ received: true, suppressed: <newly suppressed> }`). Everything is persisted durably before the 200 acknowledgement and processing is idempotent (duplicates return `duplicate: true` / `suppressed: 0`).'
      parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Durably received, content: { application/json: { schema: { type: object, required: [ received ], properties: { received: { type: boolean }, duplicate: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/admin/me:
    get:
      tags: [ Admin ]
      operationId: adminMe
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ userId, role, permissions, mfa ], properties: { userId: { type: string }, role: { type: string }, permissions: { type: array, items: { type: string } }, mfa: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/admin/dashboard:
    get: { tags: [ Admin ], operationId: adminDashboard, security: [ { bearerAuth: [] } ], responses: { '200': { description: Dashboard figures, content: { application/json: { schema: { $ref: "#/components/schemas/AdminDashboard" } } } } }, description: Requires permission `orders:read`. Figures cover the last 30 calendar days in Asia/Kolkata; `definitions` states exactly what each figure means. }
  /v1/admin/orders:
    get: { tags: [ Admin ], operationId: adminListOrders, security: [ { bearerAuth: [] } ], responses: { '200': { description: A page of orders, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrderPage" } } } } }, description: "Requires permission `orders:read`. Keyset-paged, newest first. The order is fixed (`created_at DESC, id DESC`); no sort parameter exists. `q` matches the order number prefix (max 40 chars).", parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }, { name: cursor, in: query, schema: { type: string, maxLength: 300 }, description: Opaque `nextCursor` from the previous page. }, { name: status, in: query, schema: { type: string } }, { name: paymentStatus, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string, maxLength: 40 } } ] }
  /v1/admin/orders/{id}:
    get: { tags: [ Admin ], operationId: adminGetOrder, security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], responses: { '200': { description: Order detail, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrderDetail" } } } } }, description: "Requires permission `orders:read`. `customerId` is returned only to roles with `customers:read`. Roles without `orders:fulfil` get a redacted address. Includes the immutable tax/shipping allocation, status history (recorded by the database), shipments, returns and email delivery state." }
