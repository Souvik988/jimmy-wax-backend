  /v1/auth/otp/request:
    post:
      tags: [ Auth ]
      operationId: requestPhoneOtp
      description: 'Sends a 6-digit code (valid 5 minutes) by SMS to an Indian mobile number. 30 s resend cooldown, 5 per hour. 503 OTP_UNAVAILABLE while no SMS provider is configured (the app should fall back to email). The configured DEMO number never sends anything.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ phone ], properties: { phone: { type: string, description: '10 digits or +91 E.164' } } } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, required: [ accepted ], properties: { accepted: { type: boolean }, expiresInSeconds: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/auth/otp/verify:
    post:
      tags: [ Auth ]
      operationId: verifyPhoneOtp
      description: 'Verifies the code and signs in (creating the account on first use). 5 wrong guesses burn the code. Errors: OTP_INVALID, OTP_EXPIRED (401).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ phone, code ], properties: { phone: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
