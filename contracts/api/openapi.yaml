              schema:
                $ref: "#/components/schemas/AdminMediaPage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
      parameters:
        - name: inUse
          in: query
          schema:
            type: boolean
