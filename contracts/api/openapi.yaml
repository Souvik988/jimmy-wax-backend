          type: object
          properties:
            configured:
              type: boolean
            provider:
              type: string
              nullable: true
            mode:
              type: string
              enum:
                - test
                - live
              nullable: true
          required:
            - configured
            - provider
            - mode
          description: "Display-safe: whether `POST /refunds/{id}/process` can work. Never contains keys. Readable with `payments:read`."
