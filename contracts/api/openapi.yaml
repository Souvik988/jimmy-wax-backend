          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          description: Report with row errors; nothing was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
  /v1/admin/media:
    post:
      tags:
        - Admin
      operationId: postAdminMedia
      description: "Requires permission `media:write`. Upload raw bytes as the request body (`application/octet-stream`; the type is sniffed from the bytes, the declared Content-Type is never trusted). Images (PNG/JPEG/WebP/GIF) are re-encoded to sanitised WebP derivatives; videos are MP4/WebM; fonts WOF2/OTF/TTF. Size caps: image 15 MiB, video 100 MiB, font 2 MiB (413/400 otherwise). Metadata travels in the query string (`filename` required; `alt`, `provenance`, `folder`, `license`, `rightsHolder`, `provenanceNote`, `consentReference`) OR, preferably, in the `X-JW-Upload-Meta` header as base64url-encoded JSON with the same keys (keeps rights details out of URLs and access logs; header values win). Content-addressed: identical bytes return the existing asset with 200 and `duplicate: true`; a new asset is 201. New assets are `draft` and NOT public until an administrator approves them. 30 uploads per minute per operator."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Identical bytes already in the library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AdminMediaAsset"
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
                        enum:
                          - true
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "201":
          description: New asset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AdminMediaAsset"
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
      parameters:
        - name: filename
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Required unless supplied in X-JW-Upload-Meta.
        - name: X-JW-Upload-Meta
          in: header
          required: false
          schema:
            type: string
          description: base64url(JSON) of the metadata keys listed above.
    get:
      tags:
        - Admin
      operationId: getAdminMedia
      description: Requires permission `media:read`. Keyset-paged, newest first. `inUse=true|false` filters by COMPLETE usage (catalogue, library entities, draft Studio documents, live releases, campaigns), so "unused" is reliable.
