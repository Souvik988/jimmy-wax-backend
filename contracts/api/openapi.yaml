        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ slug, title, bodyMd, version ], properties: { slug: { type: string }, kind: { type: string }, title: { type: string }, bodyMd: { type: string }, version: { type: integer }, publishedAt: { type: string, format: date-time } } } } } }
