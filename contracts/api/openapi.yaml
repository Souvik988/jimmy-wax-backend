      description: 'One cacheable call: categories, catalogue (display order) and store policy.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ categories, products, store ], properties: { categories: { type: array, items: { $ref: '#/components/schemas/Category' } }, products: { type: array, items: { $ref: '#/components/schemas/Product' } }, store: { type: object, nullable: true } } } } } }
  /v1/admin/orders/{id}/shipments:
    get: { tags: [ Admin ], operationId: adminOrderShipments, security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], responses: { '200': { description: Shipments, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminShipmentSummary" } } }, required: [ items ] } } } } }, description: "Requires permission `orders:read`. Shipments of an order with their events and, for manual shipments, the package snapshot." }
    post: { tags: [ Admin ], operationId: adminCreateShipment, description: Requires permission `orders:fulfil`. MANUAL shipment (courier and tracking typed in). The order must be `processing`; it becomes `shipped`. Optional `package` records the real parcel when it differs from the catalogue and then `overrideReason` (3-200 chars) is mandatory; both are stored on the shipment and in the audit row., security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ courier, trackingNumber ], properties: { courier: { type: string, minLength: 2, maxLength: 80 }, trackingNumber: { type: string, minLength: 3, maxLength: 80 }, trackingUrl: { type: string, format: uri, pattern: ^https://, nullable: true }, package: { $ref: "#/components/schemas/PackageSnapshot" }, overrideReason: { type: string, minLength: 3, maxLength: 200 } } } } } }, responses: { '201': { description: Created, content: { application/json: { schema: { type: object } } } } } }
  /v1/admin/shipments/{id}/events:
    post: { tags: [ Admin ], operationId: adminShipmentEvent, security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '204': { description: Recorded } }, description: "Requires permission `orders:fulfil`. Manual tracking events are FORWARD ONLY (label_created -> in_transit -> out_for_delivery -> delivered, or failed / returned_to_origin); a non-forward or post-terminal event is 409 `ILLEGAL_STATE`. The server decides; the console should offer only legal next states." }
  /v1/admin/shipping/pins:
    get: { tags: [ Admin ], operationId: adminPins, description: 'Returns { items: [{prefix, note}], etag } — the etag is a fingerprint of the list that a write must echo back.', security: [ { bearerAuth: [] } ], responses: { '200': { description: OK, content: { application/json: { schema: { type: object, required: [ items, etag ], properties: { items: { type: array, items: { type: object, properties: { prefix: { type: string }, note: { type: string, nullable: true } } } }, etag: { type: string, pattern: '^[0-9a-f]{64}$' } } } } } } } }
    put:
      tags: [ Admin ]
      operationId: adminSetPins
      description: >-
        Requires MFA. Guarded and audited: `expectedEtag` (from GET; 409 `CART_VERSION_CONFLICT` if the list changed) and `reason` are required. Bumps `rules_version` so open checkout quotes are re-validated.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ expectedEtag, reason ]
              properties:
                add: { type: array, maxItems: 2000, items: { type: string, pattern: '^[0-9]{3,6}$' } }
                remove: { type: array, maxItems: 2000, items: { type: string, pattern: '^[0-9]{3,6}$' } }
                note: { type: string, maxLength: 100 }
                expectedEtag: { type: string, minLength: 64, maxLength: 64 }
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses: { '204': { description: Updated } }
  /v1/admin/returns:
    get: { tags: [ Admin ], operationId: adminReturns, security: [ { bearerAuth: [] } ], responses: { '200': { description: A page of returns, content: { application/json: { schema: { $ref: "#/components/schemas/ReturnPage" } } } } }, description: "Requires permission `orders:read`. Newest first, keyset-paged (default 100, max 200). `status` filters. The response also carries the store return-window policy so roles without `settings:read` can see it (DASH-BR-013).", parameters: [ { name: status, in: query, schema: { type: string, enum: [ requested, approved, rejected, received, closed ] } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }, { name: cursor, in: query, schema: { type: string, maxLength: 300 } } ] }
  /v1/admin/returns/{id}/decide:
    post: { tags: [ Admin ], operationId: adminDecideReturn, security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '204': { description: Decided } }, description: "Requires permission `orders:fulfil`. Body `{ approve: boolean, note: string(3-300) }`; 204. Only a `requested` return can be decided (409 `ILLEGAL_STATE` otherwise)." }
  /v1/admin/returns/{id}/receive:
    post: { tags: [ Admin ], operationId: adminReceiveReturn, description: "Requires permission `orders:fulfil` AND `inventory:write`, and an MFA (aal2) session (it restocks inventory). Once-only: a repeat is 409 `ILLEGAL_STATE`. For online-paid orders it queues a refund (`refundQueued`); for COD `manualRefundRequired` is true.", security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], responses: { '200': { description: Return received, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, status: { type: string }, refundValuePaise: { $ref: "#/components/schemas/Money" }, refundQueued: { type: boolean }, manualRefundRequired: { type: boolean } }, required: [ id, status, refundValuePaise, refundQueued, manualRefundRequired ] } } } } } }
  /v1/admin/orders/{id}/invoice:
    get: { tags: [ Admin ], operationId: adminInvoice, security: [ { bearerAuth: [] } ], parameters: [ { $ref: '#/components/parameters/Uuid' } ], responses: { '200': { description: The issued invoice, content: { application/json: { schema: { $ref: "#/components/schemas/AdminInvoice" } } } }, "404": { $ref: "#/components/responses/Error" } }, description: "Requires permission `orders:read`. READ ONLY: returns the already-issued invoice or 404 `NOT_FOUND` when none has been issued (it never issues one). Roles without `orders:fulfil` get `buyer.address` blanked. Issue with `POST` on the same path." }
    post:
      tags:
        - Admin
      operationId: adminIssueInvoice
      description: "Requires permission `orders:fulfil` and an MFA (aal2) session. Issues the GST invoice for a confirmed-or-later order exactly once: numbers are consecutive per financial year and immutable. Needs a `reason` (3-300 chars), audited as `invoice.issue`. 201 when created, 200 with the original when already issued (replay-safe). 503 `POLICY_NOT_CONFIGURED` until the seller GST profile (GSTIN, legal name, state, address) is set in Settings; 409 `ILLEGAL_STATE` before the order is confirmed."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  $ref: "#/components/schemas/GuardReason"
      responses:
        "200":
          description: Already issued; the original
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvoice"
        "201":
          description: Issued now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvoice"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
