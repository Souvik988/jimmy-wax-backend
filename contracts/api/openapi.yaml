    post:
      tags:
        - Admin
      operationId: postAdminCatalogImport
      description: Requires permission `catalog:write`. Body is raw UTF-8 CSV (`text/csv`, max 2 MB / 5,000 rows). `dryRun` (query, default true) returns the report only; HTTP 422 with the same report shape when any row has errors. Applying (`dryRun=false`) additionally requires `previewHash` (echo of the dry run for this exact file against current data; otherwise 409 `CART_VERSION_CONFLICT`) and `reason` (3-300 chars); it is all-or-nothing and a replay fails because the data moved on.
      parameters:
        - { name: dryRun, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: previewHash, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: reason, in: query, required: false, schema: { type: string, minLength: 3, maxLength: 300 } }
