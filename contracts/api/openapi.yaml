  /v1/admin/experience/{channel}/docs/{kind}/{key}/discard-draft:
    post:
      tags:
        - Admin
      operationId: postAdminExperienceChannelDocsKindKeyDiscardDraft
      description: >-
        Requires permission `experience:write`. Returns the draft to the version that is currently live (the last published snapshot) as a NEW revision, so the discarded edits stay in the revision history. Send the draft's current revision in `If-Match`; a stale one is 409 `ETAG_MISMATCH` with the current document in `error.lines[0]`. `ILLEGAL_STATE` (409) when the document was never published (nothing to return to) or for the shared design system (`channel=shared` has no published copy). When the draft already equals the live version the current row is returned unchanged and no revision is written. Audited as `experience.draft.discard` with the reason.
      security:
        - bearerAuth: []
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum:
              - app
              - web
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: The draft revision you loaded (the document `rev`, as a number or the quoted ETag).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        "200":
          description: The draft document after the discard (new `rev`, `etag` also in the ETag header).
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/experience/{channel}/docs/{kind}/{key}/revisions:
