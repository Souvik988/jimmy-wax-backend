            example: orig.webp
      responses:
        "200":
          description: The file bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/admin/outbox/suppressions:
    get:
      tags:
        - Admin
      operationId: getAdminOutboxSuppressions
      description: "Requires permission `ops:read`. Addresses that hard-bounced (permanent SMTP failure or provider bounce) or complained: they are never mailed again until lifted. Newest first, last 200."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suppressed addresses
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailSuppression"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/outbox/suppressions/lift:
    post:
      tags:
        - Admin
      operationId: postAdminOutboxSuppressionsLift
      description: Requires permission `settings:write` and an MFA (aal2) session. Removes an address from the do-not-mail list (for example after the customer fixed a full mailbox). Body `{ email, reason }` (reason 3-300 chars, audited as `email.suppression.lift`). 204; 404 when the address is not suppressed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - reason
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                reason:
                  $ref: "#/components/schemas/GuardReason"
      responses:
        "204":
          description: Lifted
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Uuid: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Slug: { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 100 } }
    VariantId: { name: variantId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$', maxLength: 100 } }
    GuestToken: { name: x-guest-cart-token, in: header, required: true, schema: { type: string, minLength: 20, maxLength: 200 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,100}$' }, description: One key per purchase attempt; reuse it only to retry the SAME request. }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
  schemas:
    Money: { type: integer, minimum: 0, maximum: 9007199254740991, description: Paise (INR minor units) }
    Gstr1Report:
      type: object
      description: GSTR-1 working paper for one IST month (tables 7 and 12). All amounts are integer paise.
      required: [ month, merchantStateCode, orders, b2cs, hsn, totals, warnings ]
      properties:
        month: { type: string, example: '2026-10' }
        merchantStateCode: { type: string, nullable: true, description: 'Two-digit GST state code taken from store_settings.merchant_gstin; null when no valid GSTIN is set.' }
        orders: { type: integer, minimum: 0 }
        b2cs:
          type: array
          description: Table 7 - B2C small, grouped by place of supply and rate.
          items:
            type: object
            required: [ placeOfSupply, rateBps, taxablePaise, igstPaise, cgstPaise, sgstPaise, orders ]
            properties:
              placeOfSupply: { type: string, example: '27-Maharashtra' }
              rateBps: { type: integer, example: 1800 }
              taxablePaise: { $ref: '#/components/schemas/Money' }
              igstPaise: { $ref: '#/components/schemas/Money' }
              cgstPaise: { $ref: '#/components/schemas/Money' }
              sgstPaise: { $ref: '#/components/schemas/Money' }
              orders: { type: integer }
        hsn:
          type: array
          description: Table 12 - HSN summary of goods (shipping and COD fees are not listed here). `hsn` is `NOT SET` when the variant has no HSN code.
          items:
            type: object
            required: [ hsn, description, uqc, quantity, totalValuePaise, taxablePaise, igstPaise, cgstPaise, sgstPaise, rateBps ]
            properties:
              hsn: { type: string }
              description: { type: string }
              uqc: { type: string, enum: [ PCS ] }
              quantity: { type: integer }
              totalValuePaise: { $ref: '#/components/schemas/Money' }
              taxablePaise: { $ref: '#/components/schemas/Money' }
              igstPaise: { $ref: '#/components/schemas/Money' }
              cgstPaise: { $ref: '#/components/schemas/Money' }
              sgstPaise: { $ref: '#/components/schemas/Money' }
              rateBps: { type: integer }
        totals:
          type: object
          required: [ taxablePaise, igstPaise, cgstPaise, sgstPaise ]
          properties:
            taxablePaise: { $ref: '#/components/schemas/Money' }
            igstPaise: { $ref: '#/components/schemas/Money' }
            cgstPaise: { $ref: '#/components/schemas/Money' }
            sgstPaise: { $ref: '#/components/schemas/Money' }
        warnings: { type: array, items: { type: string }, description: Human-readable caveats; show them next to the numbers. }
    ErrorCode:
      type: string
      enum: [ VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CART_VERSION_CONFLICT, QUOTE_EXPIRED, QUOTE_STALE, QUOTE_ALREADY_USED, ITEM_UNAVAILABLE, STOCK_SHORTAGE, UNSUPPORTED_PAYMENT_METHOD, NOT_SERVICEABLE, POLICY_NOT_CONFIGURED, CHECKOUT_DISABLED, DUPLICATE_REQUEST_MISMATCH, REQUEST_IN_PROGRESS, ILLEGAL_STATE, RATE_LIMITED, PAYLOAD_TOO_LARGE, OTP_INVALID, OTP_EXPIRED, OTP_UNAVAILABLE, INTERNAL, UNAVAILABLE, MFA_REQUIRED, ETAG_MISMATCH, COUPON_INVALID ]
    ErrorBody:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message, requestId, retryable ]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            requestId: { type: string }
            retryable: { type: boolean }
            fields: { type: object, additionalProperties: { type: string } }
            lines: { type: array, items: { type: object } }
    Category: { type: object, required: [ id, name ], properties: { id: { type: string }, name: { type: string } } }
    StoreSettingsPublic:
      type: object
      required: [ shippingFeePaise, freeShippingThresholdPaise, codEnabled, codMaxOrderPaise, codFeePaise, gstRateBps, taxInclusive, checkoutOpen, deliveryEstimate, currency ]
      properties:
        shippingFeePaise: { $ref: '#/components/schemas/Money' }
        freeShippingThresholdPaise: { type: integer, nullable: true }
        codEnabled: { type: boolean }
        codMaxOrderPaise: { type: integer, nullable: true }
        codFeePaise: { type: integer, description: Added to every Cash-on-Delivery order }
        onlinePaymentsEnabled: { type: boolean, description: 'True when customers can pay online (UPI, cards, netbanking). Offer the option only then; the quote request still decides with paymentMethod online.' }
        gstRateBps: { type: integer, description: 1800 = 18% }
        taxInclusive: { type: boolean }
        checkoutOpen: { type: boolean }
        deliveryEstimate: { type: string }
        currency: { type: string, enum: [ INR ] }
        ordersPaused: { type: boolean, description: 'Operator has paused new orders; checkoutOpen is false while true' }
        pauseMessage: { type: string, description: Shown to customers while paused }
        brandName: { type: string }
        supportEmail: { type: string, nullable: true }
        supportPhone: { type: string, nullable: true }
    Media: { type: object, required: [ assetPath, alt ], properties: { assetPath: { type: string }, alt: { type: string } } }
    Variant:
      type: object
      required: [ id, sku, title, pricePaise, comparePaise, currency, available, availableQuantity ]
      properties:
        id: { type: string }
        sku: { type: string }
        title: { type: string }
        pricePaise: { $ref: '#/components/schemas/Money' }
        comparePaise: { type: integer, nullable: true }
        currency: { type: string, enum: [ INR ] }
        available: { type: boolean }
        availableQuantity: { type: integer, minimum: 0, maximum: 10, description: Capped at 10 so the public API does not reveal inventory depth }
    Product:
      type: object
      required: [ id, categoryId, name, subtitle, description, keyBenefits, variant, media ]
      properties:
        id: { type: string }
        categoryId: { type: string }
        name: { type: string }
        subtitle: { type: string }
        description: { type: string }
        keyBenefits: { type: array, items: { type: string } }
        suitableSurfaces: { type: string, nullable: true }
        boxContents: { type: string, nullable: true }
        variant: { $ref: '#/components/schemas/Variant' }
        variants: { type: array, description: All active variants in a stable order; variant is the in-stock default when available., items: { $ref: '#/components/schemas/Variant' } }
        media: { type: array, items: { $ref: '#/components/schemas/Media' } }
    ProductPage: { type: object, required: [ items, nextCursor ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } }, nextCursor: { type: string, nullable: true } } }
    Review: { type: object, required: [ id, rating, title, body, verifiedPurchase, createdAt ], properties: { photos: { type: array, items: { type: object, properties: { id: { type: string }, url: { type: string }, width: { type: integer }, height: { type: integer } } } }, id: { type: string }, rating: { type: integer, minimum: 1, maximum: 5 }, title: { type: string }, body: { type: string }, verifiedPurchase: { type: boolean }, createdAt: { type: string, format: date-time } } }
    ReviewPage: { type: object, required: [ items, nextCursor ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Review' } }, nextCursor: { type: string, nullable: true } } }
    WishlistPage: { type: object, required: [ items, nextCursor ], properties: { items: { type: array, items: { type: object, required: [ productId, addedAt ], properties: { productId: { type: string }, addedAt: { type: string, format: date-time } } } }, nextCursor: { type: string, nullable: true } } }
    Me:
      type: object
      required: [ id, fullName, phone, preferences ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        accountPhone: { type: string, nullable: true, description: Masked sign-in number }
        emailVerified: { type: boolean }
        demo: { type: boolean }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        preferences: { type: object, required: [ orderUpdates, offersAndCareTips ], properties: { orderUpdates: { type: boolean }, offersAndCareTips: { type: boolean } } }
    AddressInput:
      type: object
      required: [ recipientName, phone, line1, city, state, postalCode ]
      properties:
        recipientName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, pattern: '^[0-9+() -]{7,20}$' }
        line1: { type: string, minLength: 1, maxLength: 240 }
        landmark: { type: string, maxLength: 240, default: '' }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        postalCode: { type: string, pattern: '^[0-9]{6}$' }
        isDefault: { type: boolean, default: false }
    Address:
      allOf:
        - { $ref: '#/components/schemas/AddressInput' }
        - { type: object, required: [ id ], properties: { id: { type: string, format: uuid } } }
    CartLineMutation: { type: object, required: [ quantity ], properties: { quantity: { type: integer, minimum: 0, maximum: 99 }, expectedVersion: { type: integer, minimum: 1 } } }
    CartLine:
      type: object
      required: [ variantId, productId, name, variantTitle, unitPricePaise, quantity, available, purchasable ]
      properties:
        variantId: { type: string }
        productId: { type: string }
        name: { type: string }
        variantTitle: { type: string }
        unitPricePaise: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        available: { type: integer, minimum: 0 }
        purchasable: { type: boolean }
    Cart:
      type: object
      required: [ id, version, currency, lines, subtotalPaise ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        currency: { type: string, enum: [ INR ] }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        subtotalPaise: { $ref: '#/components/schemas/Money' }
        couponCode: { type: string, nullable: true, description: Coupon attached with POST /v1/cart/coupon }
    CreateQuoteRequest: { type: object, required: [ addressId, paymentMethod ], properties: { addressId: { type: string, format: uuid }, paymentMethod: { type: string, enum: [ cod, online ] }, couponCode: { type: string, minLength: 3, maxLength: 32, description: Overrides the cart coupon for this quote } } }
    OrderLine:
      type: object
      required: [ variantId, productId, sku, productName, variantTitle, assetPath, unitPricePaise, quantity, lineTotalPaise ]
      properties:
        orderItemId: { type: integer, minimum: 1, description: Immutable order line identifier used when requesting a return }
        variantId: { type: string }
        productId: { type: string }
        sku: { type: string }
        productName: { type: string }
        variantTitle: { type: string }
        assetPath: { type: string }
        unitPricePaise: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer, minimum: 1 }
        lineTotalPaise: { $ref: '#/components/schemas/Money' }
        discountPaise: { $ref: '#/components/schemas/Money', description: Share of the coupon discount allocated to this line (0 without a coupon) }
    Quote:
      type: object
      required: [ id, currency, paymentMethod, lines, subtotalPaise, discountPaise, taxPaise, codFeePaise, taxInclusive, shippingPaise, totalPaise, cartVersion, expiresAt, stockReserved ]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, enum: [ INR ] }
        paymentMethod: { type: string, enum: [ cod, online ] }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        subtotalPaise: { $ref: '#/components/schemas/Money' }
        discountPaise: { $ref: '#/components/schemas/Money', description: Coupon discount on items; GST is computed on the discounted line amounts }
        couponCode: { type: string, nullable: true }
        shippingDiscountPaise: { $ref: '#/components/schemas/Money', description: Shipping waived by a free-shipping coupon (shippingPaise is already net) }
        taxPaise: { $ref: '#/components/schemas/Money' }
        shippingPaise: { $ref: '#/components/schemas/Money' }
        codFeePaise: { $ref: '#/components/schemas/Money', description: Cash-on-delivery handling fee (0 for online payment) }
        taxInclusive: { type: boolean, description: true = listed prices already include GST; taxPaise is the GST CONTAINED in the total }
        taxBreakdown: { type: object, description: 'Per-component GST: lines, shipping, COD fee' }
        totalPaise: { $ref: '#/components/schemas/Money', description: 'subtotal - discount + shipping + codFee (+ tax only when taxInclusive is false)' }
        cartVersion: { type: integer }
        expiresAt: { type: string, format: date-time }
        stockReserved: { type: boolean, enum: [ false ] }
    OrderStatus: { type: string, enum: [ pending_payment, placed, confirmed, processing, shipped, out_for_delivery, delivered, cancelled, returned, expired ] }
    PaymentStatus: { type: string, enum: [ pending, authorized, paid, failed, refunded, partially_refunded, cod_due, cod_collected, cod_failed, exception ] }
    Order:
      type: object
      required: [ id, orderNumber, status, paymentStatus, paymentMethod, currency, subtotalPaise, discountPaise, taxPaise, codFeePaise, taxInclusive, shippingPaise, totalPaise, address, lines, createdAt, version ]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { type: string, enum: [ cod, online ] }
        currency: { type: string, enum: [ INR ] }
        subtotalPaise: { $ref: '#/components/schemas/Money' }
        discountPaise: { $ref: '#/components/schemas/Money' }
        couponCode: { type: string, nullable: true }
        shippingDiscountPaise: { $ref: '#/components/schemas/Money' }
        taxPaise: { $ref: '#/components/schemas/Money' }
        shippingPaise: { $ref: '#/components/schemas/Money' }
        codFeePaise: { $ref: '#/components/schemas/Money' }
        taxInclusive: { type: boolean }
        taxBreakdown: { type: object }
        totalPaise: { $ref: '#/components/schemas/Money' }
        address: { type: object, additionalProperties: { type: string }, description: Immutable purchase-time snapshot }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    OrderSummary:
      type: object
      required: [ id, orderNumber, status, paymentStatus, paymentMethod, totalPaise, currency, createdAt ]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { type: string, enum: [ cod, online ] }
        totalPaise: { $ref: '#/components/schemas/Money' }
        currency: { type: string, enum: [ INR ] }
        createdAt: { type: string, format: date-time }
    OrderPage: { type: object, required: [ items, nextCursor ], properties: { items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }, nextCursor: { type: string, nullable: true } } }
    PaymentAttempt:
      type: object
      required: [ id, orderId, status, amountPaise, currency, provider, clientConfig ]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [ created, pending, authorized, captured, failed, expired, cancelled ] }
        amountPaise: { $ref: '#/components/schemas/Money' }
        currency: { type: string, enum: [ INR ] }
        provider: { type: string }
        clientConfig: { type: object, nullable: true, additionalProperties: { type: string } }
    PaymentStatusView:
      type: object
      required: [ orderId, orderStatus, paymentStatus, attempts ]
      properties:
        orderId: { type: string, format: uuid }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        attempts: { type: array, items: { type: object, required: [ id, status, amountPaise, createdAt ], properties: { id: { type: string }, status: { type: string }, amountPaise: { type: integer }, createdAt: { type: string, format: date-time } } } }
    AuthTokens:
      type: object
      required: [ accessToken, expiresIn, refreshToken, tokenType, aal ]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds }
        refreshToken: { type: string, description: 'Opaque and rotating; store in secure storage' }
        tokenType: { type: string, enum: [ Bearer ] }
        aal: { type: string, enum: [ aal1, aal2 ] }
    AuthSession:
      allOf:
        - { $ref: '#/components/schemas/AuthTokens' }
        - type: object
          required: [ user ]
          properties:
            user: { type: object, required: [ id, email, phone, emailVerified ], properties: { id: { type: string, format: uuid }, email: { type: string, nullable: true }, phone: { type: string, nullable: true, description: 'Masked: last four digits only' }, emailVerified: { type: boolean } } }
            mfa: { type: object, properties: { required: { type: boolean }, enrolled: { type: boolean } } }
    Shipment:
      type: object
      required: [ id, courier, trackingNumber, status, events ]
      properties:
        id: { type: string, format: uuid }
        courier: { type: string }
        trackingNumber: { type: string }
        trackingUrl: { type: string, nullable: true }
        status: { type: string, enum: [ label_created, in_transit, out_for_delivery, delivered, failed, returned_to_origin ] }
        events: { type: array, items: { type: object, required: [ status, description, occurredAt ], properties: { status: { type: string }, description: { type: string }, occurredAt: { type: string, format: date-time } } } }
    CursorPage:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
    AdminOrderRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        totalPaise:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
        demo:
          type: boolean
      required:
        - id
        - orderNumber
        - status
        - paymentStatus
        - paymentMethod
        - totalPaise
        - createdAt
        - version
    AdminOrderPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderRow"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor
    AdminOrderDetail:
      type: object
      description: Versioned order detail. Money is integer paise; `allocation` and the per-line tax fields are the immutable snapshot taken at order time.
      required:
        - id
        - orderNumber
        - status
        - paymentStatus
        - paymentMethod
        - version
        - totalPaise
        - lines
        - statusHistory
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          nullable: true
          description: Present only for roles with `customers:read`; null otherwise. Use it for the audited customer reveal.
        orderNumber:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        version:
          type: integer
        couponCode:
          type: string
          nullable: true
        subtotalPaise:
          $ref: "#/components/schemas/Money"
        discountPaise:
          $ref: "#/components/schemas/Money"
        shippingDiscountPaise:
          $ref: "#/components/schemas/Money"
        taxPaise:
          $ref: "#/components/schemas/Money"
        shippingPaise:
          $ref: "#/components/schemas/Money"
        codFeePaise:
          $ref: "#/components/schemas/Money"
        taxInclusive:
          type: boolean
        totalPaise:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          enum:
            - INR
        address:
          type: object
          additionalProperties: true
          description: Delivery address snapshot; roles without `orders:fulfil` get name, city, state and PIN only.
        createdAt:
          type: string
          format: date-time
        allocation:
          type: object
          properties:
            taxRateBps:
              type: integer
              nullable: true
            shipping:
              type: object
              properties:
                taxablePaise:
                  $ref: "#/components/schemas/Money"
                taxPaise:
                  $ref: "#/components/schemas/Money"
                totalPaise:
                  $ref: "#/components/schemas/Money"
            codFee:
              type: object
              properties:
                taxablePaise:
                  $ref: "#/components/schemas/Money"
                taxPaise:
                  $ref: "#/components/schemas/Money"
                totalPaise:
                  $ref: "#/components/schemas/Money"
        statusHistory:
          type: array
          description: Oldest first; recorded by the database on every status change (orders that predate it show their current status only).
          items:
            type: object
            properties:
              from:
                type: string
                nullable: true
              to:
                type: string
              at:
                type: string
                format: date-time
            required:
              - from
              - to
              - at
        shipments:
          type: array
          items:
            $ref: "#/components/schemas/AdminShipmentSummary"
        returns:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
              reason:
                type: string
              createdAt:
                type: string
                format: date-time
        messages:
          type: array
          description: Transactional email delivery state for this order (queued/sent/failed/suppressed).
          items:
            type: object
            properties:
              template:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - sent
                  - failed
                  - suppressed
              createdAt:
                type: string
                format: date-time
        lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              productId:
                type: string
              variantId:
