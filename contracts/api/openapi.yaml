  /v1/admin/analytics/gstr1:
    get:
      tags:
        - Admin
      operationId: getAdminAnalyticsGstr1
      description: >-
        Requires permission `analytics:read`. GSTR-1 WORKING PAPER (tables 7 B2CS and 12 HSN summary) for one India Standard Time calendar month, built from the stored order tax breakdowns of orders in placed..delivered. It is a preparation aid for the accountant, not a filing: credit notes, B2B invoices, exports and nil-rated supplies are out of scope (the response `warnings` say so). Place of supply comes from the delivery state; CGST/SGST vs IGST is decided against the state of `store_settings.merchant_gstin` (without a valid GSTIN every sale is shown as IGST and a warning is added). HSN rows use the variant `hsnCode`; lines without one appear as `NOT SET`. Amounts are integer paise in JSON. `format=csv` returns ONE table (`table=b2cs|hsn`) in the offline-tool column layout as `text/csv; charset=utf-8` with `Content-Disposition: attachment; filename="jimmywax-gstr1-<table>-<month>.csv"`; amounts are rupees there.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          description: IST month, `YYYY-MM`.
          schema:
            type: string
            pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - csv
            default: json
        - name: table
          in: query
          required: false
          description: Only used with `format=csv`.
          schema:
            type: string
            enum:
              - b2cs
              - hsn
            default: b2cs
      responses:
        "200":
          description: The working paper (JSON) or one table (CSV).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gstr1Report"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/analytics/gst:
    get:
      tags:
