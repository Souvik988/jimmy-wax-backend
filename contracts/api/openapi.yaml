      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ code ], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ accessToken, expiresIn, aal ], properties: { accessToken: { type: string }, expiresIn: { type: integer }, aal: { type: string, enum: [ aal2 ] }, tokenType: { type: string } } } } } }
