# Lean local stack for backend development and CI. Project name keeps it isolated
# from any other compose projects on the machine.
name: jimmywax-backend
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jimmywax
    ports: ["${PG_HOST_PORT:-54422}:5432"]
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jimmywax"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis-cache:      # OPTIONAL: shared rate-limit counters only (set REDIS_CACHE_URL=redis://127.0.0.1:56380). Without it limits are per process.
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["56380:6379"]
volumes:
  pgdata:
